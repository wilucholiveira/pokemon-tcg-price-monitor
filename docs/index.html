<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Binder — Monitor de Preços Pokémon TCG</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap');
  :root {
    --bg: #0F1220; --panel: #171B2C; --panel2: #1D2237; --border: #2A2F49;
    --text: #EDEAE0; --muted: #8B90A8; --teal: #17D6B0; --magenta: #FF4FA3;
    --gold: #E8B93F; --red: #FF6B6B; --green: #35D48A;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; }
  .header { border-bottom: 1px solid var(--border); padding: 16px; display: flex; justify-content: space-between; align-items: center; }
  .brand { font-family: 'Barlow Condensed', sans-serif; font-size: 24px; font-weight: 800; }
  .brand .binder { background: linear-gradient(90deg, var(--teal), var(--magenta)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .brand .sub { color: var(--muted); font-size: 13px; font-weight: 500; font-family: 'Inter', sans-serif; margin-left: 8px; }
  button { font-family: 'Inter', sans-serif; cursor: pointer; border: none; }
  .btn-primary { background: var(--gold); color: #171307; font-weight: 600; padding: 8px 14px; border-radius: 999px; font-size: 14px; }
  .btn-primary:disabled { opacity: 0.6; cursor: default; }
  .container { padding: 16px; max-width: 900px; margin: 0 auto; }
  .muted { color: var(--muted); }
  .grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
  @media (min-width: 640px) { .grid { grid-template-columns: 1fr 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 16px; cursor: pointer; }
  .card:hover { filter: brightness(1.1); }
  .card-type { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin-bottom: 6px; }
  .card-name { font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 18px; margin-bottom: 8px; }
  .card-price { font-family: 'JetBrains Mono', monospace; font-size: 24px; font-weight: 700; color: var(--teal); }
  .card-meta { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .stamp { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--gold); color: var(--gold); font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 11px; flex-shrink: 0; }
  .ticket { background: linear-gradient(135deg, var(--panel2), var(--panel)); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
  .ticket-price { font-family: 'JetBrains Mono', monospace; font-size: 36px; font-weight: 700; background: linear-gradient(90deg, var(--teal), var(--magenta)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .row { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 12px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .period-tabs { display: flex; gap: 4px; margin: 12px 0; }
  .period-tabs button { background: transparent; color: var(--muted); border: 1px solid var(--border); font-size: 12px; font-weight: 600; padding: 4px 12px; border-radius: 999px; font-family: 'JetBrains Mono', monospace; }
  .period-tabs button.active { background: var(--gold); color: #171307; border-color: var(--gold); }
  .chart-box { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 12px; }
  .back-btn { background: transparent; color: var(--muted); font-size: 14px; }
  .empty { border: 1px dashed var(--border); color: var(--muted); border-radius: 16px; padding: 40px; text-align: center; font-size: 14px; }
  .section-title { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; margin: 20px 0 8px; }
  .search-block { background: var(--panel2); border: 1px solid var(--border); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
  .search-block-label { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 15px; margin-bottom: 2px; }
  .search-block-hint { color: var(--muted); font-size: 11px; margin-bottom: 8px; }
  .search-wrap { position: relative; flex: 1; }
  .autocomplete-list { position: absolute; top: 100%; left: 0; right: 0; background: var(--panel); border: 1px solid var(--border); border-top: none; border-radius: 0 0 10px 10px; z-index: 20; max-height: 220px; overflow-y: auto; }
  .autocomplete-item { padding: 8px 12px; font-size: 13px; cursor: pointer; }
  .autocomplete-item:hover { background: var(--panel2); }
  select.filter-select { background: var(--panel); border: 1px solid var(--border); color: var(--text); border-radius: 999px; padding: 6px 12px; font-family: 'Inter', sans-serif; font-size: 12px; }
  .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 12px; }
  @media (min-width: 480px) { .stats-grid { grid-template-columns: repeat(5, 1fr); } }
  .stat-box { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; }
  .stat-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
  .stat-value { font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 700; margin-top: 2px; }
</style>
</head>
<body>
  <div class="header">
    <div class="brand"><span class="binder">BINDER</span><span class="sub">monitor de preços TCG</span></div>
    <button id="backBtn" class="back-btn" style="display:none">← voltar</button>
  </div>
  <div class="container" id="app">
    <p class="muted">Carregando...</p>
  </div>

<script>
const API = "./data.json";
const SEARCH_API = "https://pokemon-price-search.wilucholiveira.workers.dev"; // ex: https://pokemon-price-search.seu-usuario.workers.dev
const AUTOCOMPLETE_API = "https://api.pokemontcg.io/v2/cards"; // API pública gratuita, só pra sugestões de nome (não usada pra preço)
let state = { history: [], latest: {}, lastRun: null, view: "dashboard", selected: null, period: 'monthly', chart: null, typeFilter: 'all' };
let autocompleteTimer = null;

const PERIODS = [
  { id: 'today', label: 'Hoje', mode: 'hour' },
  { id: 'monthly', label: 'Mensal', mode: 'month', buckets: 12 },
  { id: 'quarterly', label: 'Trimestral', mode: 'quarter', buckets: 8 },
  { id: 'semiannual', label: 'Semestral', mode: 'semester', buckets: 4 },
  { id: 'annual', label: 'Anual', mode: 'year', buckets: 5 },
];

function fmtPrice(v, market) {
  if (v == null) return "—";
  return (market === "BR" ? "R$ " : "US$ ") + Number(v).toFixed(2);
}
function fmtDate(iso) {
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString('pt-BR', { day: '2-digit', month: 'short' });
}
function fmtTime(timestampUTC) {
  // timestamp vem em UTC (ex: "2026-08-23T17:05+00:00"); converte pra horário de Brasília
  const d = new Date(timestampUTC);
  return d.toLocaleTimeString('pt-BR', { timeZone: 'America/Sao_Paulo', hour: '2-digit', minute: '2-digit' });
}
function fmtDateTime(timestampUTC, dateOnly) {
  if (!timestampUTC) return fmtDate(dateOnly);
  const d = new Date(timestampUTC);
  const datePart = d.toLocaleDateString('pt-BR', { timeZone: 'America/Sao_Paulo', day: '2-digit', month: 'short' });
  const timePart = fmtTime(timestampUTC);
  return `${datePart}, ${timePart}`;
}

async function loadData() {
  // Duas fontes de dados: o rastreamento automático (data.json, via GitHub Actions)
  // e o histórico de buscas ao vivo (via Worker/KV) — mescladas numa única lista.
  const [trackedData, liveSearchData] = await Promise.all([
    fetch(API + "?t=" + Date.now()).then(r => r.json()).catch(() => ({ history: [], latest: {} })),
    (SEARCH_API ? fetch(`${SEARCH_API}?action=history`).then(r => r.json()) : Promise.resolve({ history: [], latest: {} }))
      .catch(() => ({ history: [], latest: {} })), // se o Worker falhar, o painel continua funcionando só com o rastreamento
  ]);

  state.history = [...(trackedData.history || []), ...(liveSearchData.history || [])];
  state.latest = { ...(liveSearchData.latest || {}), ...(trackedData.latest || {}) }; // rastreado tem prioridade em caso de mesmo nome
  state.lastRun = trackedData.lastRun;
  render();
}

function itemNames() {
  return Object.keys(state.latest);
}

function bestQuoteFor(name) {
  const sites = state.latest[name] || {};
  const entries = Object.entries(sites);
  if (entries.length === 0) return null;
  entries.sort((a, b) => (b[1].price || 0) - (a[1].price || 0)); // sem confiabilidade aqui, só pega mais recente
  return { site: entries[0][0], ...entries[0][1] };
}

function itemMarket(name) {
  const row = state.history.find(h => h.item === name);
  return row ? row.market : "BR";
}
function itemType(name) {
  const row = state.history.find(h => h.item === name);
  return row ? row.type : "box";
}

function isSealedType(type) {
  return type && type !== 'card';
}

function distinctSealedTypes() {
  const types = new Set();
  state.history.forEach(h => { if (isSealedType(h.type)) types.add(h.type); });
  return Array.from(types).sort();
}

async function fetchAutocomplete(term) {
  const box = document.getElementById('autocompleteBox');
  if (!term || term.trim().length < 3) { box.innerHTML = ''; box.style.display = 'none'; return; }
  try {
    const res = await fetch(`${AUTOCOMPLETE_API}?q=name:${encodeURIComponent(term.trim())}*&pageSize=8&select=name`);
    if (!res.ok) throw new Error('falha na API de sugestões');
    const data = await res.json();
    const names = Array.from(new Set((data.data || []).map(c => c.name))).slice(0, 8);
    if (names.length === 0) { box.innerHTML = ''; box.style.display = 'none'; return; }
    box.innerHTML = names.map(n => `<div class="autocomplete-item" onmousedown="selectSuggestion('${n.replace(/'/g, "\\'")}')">${n}</div>`).join('');
    box.style.display = 'block';
  } catch (e) {
    // Sugestão é um "nice to have" — se a API pública falhar ou estiver fora do ar,
    // a busca por nome continua funcionando normalmente, só sem a lista de sugestões.
    box.innerHTML = '';
    box.style.display = 'none';
  }
}

function onNameInput(value) {
  clearTimeout(autocompleteTimer);
  autocompleteTimer = setTimeout(() => fetchAutocomplete(value), 300); // debounce, evita 1 requisição por tecla
}

function selectSuggestion(name) {
  document.getElementById('nameSearchInput').value = name;
  document.getElementById('autocompleteBox').style.display = 'none';
  liveSearchByName();
}

async function liveSearchByName() {
  const query = document.getElementById('nameSearchInput').value.trim();
  const resultsBox = document.getElementById('nameSearchResults');
  document.getElementById('autocompleteBox').style.display = 'none';

  if (!SEARCH_API) {
    resultsBox.innerHTML = `<div class="empty">Busca ao vivo ainda não configurada — falta a URL do Worker (veja o README).</div>`;
    return;
  }
  if (query.length < 3) {
    resultsBox.innerHTML = `<div class="empty">Digite pelo menos 3 letras.</div>`;
    return;
  }

  resultsBox.innerHTML = `<p class="muted" style="font-size:13px">Buscando "${query}" em produtos lacrados e cards avulsos...</p>`;

  try {
    const res = await fetch(`${SEARCH_API}?mode=name&q=${encodeURIComponent(query)}`);
    const data = await res.json();
    renderSearchResults(data, resultsBox, query, query, 'box');
  } catch (e) {
    resultsBox.innerHTML = `<div class="empty">Erro ao buscar: ${e.message}</div>`;
  }
}

async function liveSearchByCode() {
  const cardNumber = document.getElementById('codeSearchInput').value.trim();
  const resultsBox = document.getElementById('codeSearchResults');

  if (!SEARCH_API) {
    resultsBox.innerHTML = `<div class="empty">Busca ao vivo ainda não configurada — falta a URL do Worker (veja o README).</div>`;
    return;
  }
  if (!cardNumber || !/^[A-Za-z0-9]+\/[A-Za-z0-9]+$/.test(cardNumber)) {
    resultsBox.innerHTML = `<div class="empty">Digite o código no formato número/total, ex: 199/165 ou SV001/SV102.</div>`;
    return;
  }

  resultsBox.innerHTML = `<p class="muted" style="font-size:13px">Buscando carta nº ${cardNumber} (só em sites de cards avulsos: MyP Cards, CardTrader)...</p>`;

  try {
    const res = await fetch(`${SEARCH_API}?mode=code&cardNumber=${encodeURIComponent(cardNumber)}`);
    const data = await res.json();
    const bestResult = (data.results || []).find(r => r.price !== null);
    const derivedName = bestResult && bestResult.title ? bestResult.title : `Carta nº ${cardNumber}`;
    renderSearchResults(data, resultsBox, cardNumber, derivedName, 'card');
  } catch (e) {
    resultsBox.innerHTML = `<div class="empty">Erro ao buscar: ${e.message}</div>`;
  }
}

function renderSearchResults(data, resultsBox, term, itemName, itemType) {
  const found = (data.results || []).filter(r => r.price !== null);
  const notFound = (data.results || []).filter(r => r.price === null);

  if (found.length === 0) {
    resultsBox.innerHTML = `<div class="empty">Nenhum preço encontrado pra "${term}". Tente um termo mais específico, ou o(s) site(s) podem ter bloqueado a busca agora.</div>`;
    return;
  }

  const rowsHtml = found.map(r => `
    <a href="${r.url || '#'}" target="_blank" rel="noopener" class="row" style="text-decoration:none; color:inherit">
      <div style="display:flex; align-items:center; gap:10px; min-width:0">
        ${r.image
          ? `<img src="${r.image}" alt="" loading="lazy" style="width:44px; height:44px; object-fit:contain; border-radius:8px; background:var(--panel2); flex-shrink:0" onerror="this.style.display='none'" />`
          : `<div style="width:44px; height:44px; border-radius:8px; background:var(--panel2); flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:16px">🃏</div>`
        }
        <div style="min-width:0">
          <div style="font-size:14px; font-weight:500">${r.site}</div>
          <div class="muted" style="font-size:11px; max-width:200px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap">${r.title || ''}</div>
        </div>
      </div>
      <div style="font-family:'JetBrains Mono',monospace; font-weight:600; color:var(--teal); flex-shrink:0; margin-left:8px">R$ ${r.price.toFixed(2)}</div>
    </a>
  `).join('');

  const notFoundNote = notFound.length > 0
    ? `<p class="muted" style="font-size:11px; margin-top:6px">sem resultado em: ${notFound.map(r => r.site).join(', ')}</p>`
    : '';

  resultsBox.innerHTML = rowsHtml + notFoundNote + `<p class="muted" style="font-size:10px; margin-top:6px">✓ salvo no histórico automaticamente</p>`;

  // Atualiza o estado local com o que acabou de ser encontrado, e refaz só a
  // lista de itens rastreados — sem redesenhar a busca (preserva o que foi digitado).
  const today = new Date().toISOString().slice(0, 10);
  const timestamp = new Date().toISOString();
  state.latest[itemName] = state.latest[itemName] || {};
  found.forEach(r => {
    state.history.push({ date: today, timestamp, item: itemName, type: itemType, market: 'BR', site: r.site, price: r.price, matchedUrl: r.url });
    state.latest[itemName][r.site] = { price: r.price, date: today, timestamp, url: r.url };
  });
  renderTrackedItemsSection();
}

function renderDashboard() {
  const app = document.getElementById('app');
  document.getElementById('backBtn').style.display = 'none';

  const searchBoxHtml = `
    <div class="section-title">pesquisa</div>

    <div class="search-block">
      <div class="search-block-label">Produtos e cards por nome</div>
      <div class="search-block-hint">busca produtos lacrados e cards avulsos · com sugestões</div>
      <div style="display:flex; gap:8px">
        <div class="search-wrap">
          <input id="nameSearchInput" type="text" placeholder="Digite o nome do produto ou card..."
            style="width:100%; background:var(--panel); border:1px solid var(--border); color:var(--text); border-radius:10px; padding:10px 12px; font-family:'Inter',sans-serif; font-size:14px"
            oninput="onNameInput(this.value)"
            onkeydown="if(event.key==='Enter') liveSearchByName()" />
          <div id="autocompleteBox" class="autocomplete-list" style="display:none"></div>
        </div>
        <button class="btn-primary" onclick="liveSearchByName()">buscar</button>
      </div>
      <div id="nameSearchResults" style="margin-top:8px"></div>
    </div>

    <div class="search-block">
      <div class="search-block-label">Cards por código</div>
      <div class="search-block-hint">pesquisa exclusivamente cards avulsos (nunca produtos lacrados) · ex: 199/165, SV001/SV102</div>
      <div style="display:flex; gap:8px">
        <input id="codeSearchInput" type="text" placeholder="Digite o código, ex: 123/198..."
          style="flex:1; background:var(--panel); border:1px solid var(--border); color:var(--text); border-radius:10px; padding:10px 12px; font-family:'JetBrains Mono',monospace; font-size:13px"
          onkeydown="if(event.key==='Enter') liveSearchByCode()" />
        <button class="btn-primary" onclick="liveSearchByCode()">buscar</button>
      </div>
      <div id="codeSearchResults" style="margin-top:8px"></div>
    </div>
  `;

  app.innerHTML = `${searchBoxHtml}<div id="trackedItemsSection"></div>`;
  renderTrackedItemsSection();
}

function renderTrackedItemsSection() {
  const container = document.getElementById('trackedItemsSection');
  if (!container) return; // não está na tela do dashboard agora — nada a fazer
  const names = itemNames();

  let lastRunHtml = '';
  if (state.lastRun) {
    lastRunHtml = `<p class="muted" style="font-size:12px">última execução: ${fmtDateTime(state.lastRun.timestamp, state.lastRun.date)} · ${state.lastRun.okCount || 0} preço(s) encontrados · atualiza sozinho a cada 1 hora</p>`;
  }

  if (names.length === 0) {
    container.innerHTML = `
      <div class="section-title">itens monitorados</div>
      <div style="margin-bottom:12px">
        <span class="muted" style="font-size:14px">0 itens monitorados</span>
      </div>
      ${lastRunHtml}
      <div class="empty">Nenhum dado ainda. O GitHub Actions ainda não rodou a primeira busca — vá na aba <b>Actions</b> do repositório e clique em "Run workflow" pra rodar agora, sem esperar o agendamento de amanhã. Ou faça uma busca ao vivo aqui em cima — toda busca com resultado passa a ser monitorada automaticamente.</div>
    `;
    return;
  }

  const sealedNames = names.filter(n => isSealedType(itemType(n)));
  const cardNames = names.filter(n => !isSealedType(itemType(n)));
  const typeOptions = distinctSealedTypes();

  const filteredSealed = state.typeFilter === 'all' ? sealedNames : sealedNames.filter(n => itemType(n) === state.typeFilter);

  const renderCard = (name) => {
    const q = bestQuoteFor(name);
    const market = itemMarket(name);
    const type = itemType(name);
    return `
      <div class="card" onclick="openItem('${name.replace(/'/g, "\\'")}')">
        <div class="card-type">${type} · ${market}</div>
        <div class="card-name">${name}</div>
        <div class="card-price">${q ? fmtPrice(q.price, market) : 'sem cotação'}</div>
        ${q ? `<div class="card-meta">via ${q.site} · ${fmtDateTime(q.timestamp, q.date)}</div>` : ''}
      </div>
    `;
  };

  const typeFilterHtml = typeOptions.length > 0 ? `
    <div style="display:flex; align-items:center; gap:8px; margin-bottom:10px">
      <span class="muted" style="font-size:12px">Tipo de produto:</span>
      <select class="filter-select" onchange="setTypeFilter(this.value)">
        <option value="all" ${state.typeFilter === 'all' ? 'selected' : ''}>Todos</option>
        ${typeOptions.map(t => `<option value="${t}" ${state.typeFilter === t ? 'selected' : ''}>${t}</option>`).join('')}
      </select>
    </div>
  ` : '';

  const sealedSectionHtml = `
    <div class="section-title">produtos lacrados</div>
    ${typeFilterHtml}
    ${filteredSealed.length > 0
      ? `<div class="grid">${filteredSealed.map(renderCard).join('')}</div>`
      : `<div class="empty">Nenhum produto lacrado ${state.typeFilter !== 'all' ? `do tipo "${state.typeFilter}" ` : ''}monitorado.</div>`}
  `;

  const cardSectionHtml = cardNames.length > 0 ? `
    <div class="section-title">cards avulsos</div>
    <div class="grid">${cardNames.map(renderCard).join('')}</div>
  ` : '';

  container.innerHTML = `
    <div style="margin-bottom:4px">
      <span class="muted" style="font-size:14px">${names.length} item(ns) monitorado(s)</span>
    </div>
    ${lastRunHtml}
    ${sealedSectionHtml}
    ${cardSectionHtml}
  `;
}

function setTypeFilter(value) {
  state.typeFilter = value;
  renderTrackedItemsSection(); // só atualiza a lista, não redesenha a busca
}

function bucketLabel(date, mode) {
  const month = date.getMonth(); // 0-11
  const year = date.getFullYear();
  if (mode === 'month') return date.toLocaleDateString('pt-BR', { month: 'short', year: '2-digit' });
  if (mode === 'quarter') return `T${Math.floor(month / 3) + 1} ${year}`;
  if (mode === 'semester') return `S${month < 6 ? 1 : 2} ${year}`;
  if (mode === 'year') return `${year}`;
}
function bucketKey(date, mode) {
  const month = date.getMonth();
  const year = date.getFullYear();
  if (mode === 'month') return `${year}-${String(month + 1).padStart(2, '0')}`;
  if (mode === 'quarter') return `${year}-Q${Math.floor(month / 3) + 1}`;
  if (mode === 'semester') return `${year}-S${month < 6 ? 1 : 2}`;
  if (mode === 'year') return `${year}`;
}
function bucketSortKey(date, mode) {
  // usado só pra ordenar os buckets cronologicamente
  const month = date.getMonth();
  const year = date.getFullYear();
  if (mode === 'month') return year * 12 + month;
  if (mode === 'quarter') return year * 4 + Math.floor(month / 3);
  if (mode === 'semester') return year * 2 + (month < 6 ? 0 : 1);
  return year;
}

function historyForItem(name, periodId) {
  const period = PERIODS.find(p => p.id === periodId) || PERIODS[1];
  const rows = state.history.filter(h => h.item === name);

  if (period.mode === 'hour') {
    // "Hoje": últimas 24h, agrupado por hora, usando o timestamp (convertido pra Brasília)
    const cutoff = Date.now() - 24 * 60 * 60 * 1000;
    const todayRows = rows.filter(r => r.timestamp && new Date(r.timestamp).getTime() >= cutoff);
    const byHour = {};
    todayRows.forEach(r => {
      const d = new Date(r.timestamp);
      const hourLabel = d.toLocaleString('pt-BR', { timeZone: 'America/Sao_Paulo', hour: '2-digit', hour12: false }) + 'h';
      byHour[hourLabel] = byHour[hourLabel] || { prices: [], sortKey: d.getTime() };
      byHour[hourLabel].prices.push(r.price);
      byHour[hourLabel].sortKey = Math.min(byHour[hourLabel].sortKey, d.getTime());
    });
    return Object.entries(byHour)
      .map(([label, { prices, sortKey }]) => ({
        label,
        price: Math.round((prices.reduce((a, b) => a + b, 0) / prices.length) * 100) / 100,
        sortKey,
      }))
      .sort((a, b) => a.sortKey - b.sortKey);
  }

  // Mensal / Trimestral / Semestral / Anual — agregado por calendário real, não por dias corridos
  const buckets = {};
  rows.forEach(r => {
    const d = new Date((r.timestamp || r.date + 'T00:00:00'));
    const key = bucketKey(d, period.mode);
    if (!buckets[key]) buckets[key] = { prices: [], label: bucketLabel(d, period.mode), sortKey: bucketSortKey(d, period.mode) };
    buckets[key].prices.push(r.price);
  });

  return Object.values(buckets)
    .sort((a, b) => a.sortKey - b.sortKey)
    .slice(-period.buckets)
    .map(b => ({ label: b.label, price: Math.round((b.prices.reduce((a, c) => a + c, 0) / b.prices.length) * 100) / 100 }));
}

function computeStats(name) {
  const rows = state.history.filter(h => h.item === name).slice().sort((a, b) => (a.timestamp || a.date).localeCompare(b.timestamp || b.date));
  if (rows.length === 0) return null;
  const prices = rows.map(r => r.price);
  const min = Math.min(...prices);
  const max = Math.max(...prices);
  const avg = prices.reduce((a, b) => a + b, 0) / prices.length;
  const current = prices[prices.length - 1];
  const first = prices[0];
  const pctChange = first !== 0 ? ((current - first) / first) * 100 : 0;
  return { min, max, avg, current, pctChange, count: prices.length };
}

function renderItem(name) {
  const app = document.getElementById('app');
  document.getElementById('backBtn').style.display = 'inline-block';
  const market = itemMarket(name);
  const type = itemType(name);
  const sites = state.latest[name] || {};
  const q = bestQuoteFor(name);

  const rowsHtml = Object.entries(sites).map(([site, data]) => `
    <div class="row">
      <div>
        <div style="font-size:14px; font-weight:500">${site}</div>
        <div class="muted" style="font-size:12px">${fmtDateTime(data.timestamp, data.date)}</div>
      </div>
      <div style="font-family:'JetBrains Mono',monospace; font-weight:600">${fmtPrice(data.price, market)}</div>
    </div>
  `).join('') || `<div class="empty">Nenhum preço registrado ainda pra este item.</div>`;

  const periodTabsHtml = PERIODS.map(p => `<button class="${state.period === p.id ? 'active' : ''}" onclick="setPeriod('${p.id}')">${p.label}</button>`).join('');

  const stats = computeStats(name);
  const statsHtml = stats ? `
    <div class="stats-grid">
      <div class="stat-box"><div class="stat-label">mínimo</div><div class="stat-value">${fmtPrice(stats.min, market)}</div></div>
      <div class="stat-box"><div class="stat-label">máximo</div><div class="stat-value">${fmtPrice(stats.max, market)}</div></div>
      <div class="stat-box"><div class="stat-label">médio</div><div class="stat-value">${fmtPrice(stats.avg, market)}</div></div>
      <div class="stat-box"><div class="stat-label">atual</div><div class="stat-value">${fmtPrice(stats.current, market)}</div></div>
      <div class="stat-box"><div class="stat-label">variação</div><div class="stat-value" style="color:${stats.pctChange > 0 ? 'var(--red)' : stats.pctChange < 0 ? 'var(--green)' : 'var(--muted)'}">${stats.pctChange > 0 ? '+' : ''}${stats.pctChange.toFixed(1)}%</div></div>
    </div>
  ` : '';

  app.innerHTML = `
    <div class="card-type">${type} · ${market === 'BR' ? 'Brasil' : 'Internacional'}</div>
    <div class="card-name" style="font-size:24px; margin-bottom:16px">${name}</div>
    <div class="ticket">
      <div>
        <div class="muted" style="font-size:12px; margin-bottom:4px">preço de referência</div>
        <div class="ticket-price">${q ? fmtPrice(q.price, market) : '—'}</div>
        ${q ? `<div class="muted" style="font-size:12px; margin-top:4px">via ${q.site} · ${fmtDateTime(q.timestamp, q.date)}</div>` : ''}
      </div>
    </div>
    <div class="section-title">cotações por site</div>
    ${rowsHtml}
    <div class="section-title">histórico de preços</div>
    ${statsHtml}
    <div class="period-tabs">${periodTabsHtml}</div>
    <div class="chart-box"><canvas id="priceChart" height="180"></canvas></div>
    ${stats && stats.count < 3 ? `<p class="muted" style="font-size:11px; margin-top:8px">Só ${stats.count} leitura(s) registrada(s) até agora — o gráfico fica mais informativo conforme o rastreamento automático acumula mais dados ao longo do tempo.</p>` : ''}
  `;

  drawChart(name);
}

function drawChart(name) {
  const data = historyForItem(name, state.period);
  const ctx = document.getElementById('priceChart').getContext('2d');
  if (state.chart) state.chart.destroy();

  if (data.length < 2) {
    ctx.fillStyle = '#8B90A8';
    ctx.font = '13px Inter';
    ctx.fillText('Dados insuficientes para este período.', 10, 90);
    return;
  }

  state.chart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: data.map(d => d.label),
      datasets: [{
        label: 'preço médio',
        data: data.map(d => d.price),
        borderColor: '#17D6B0',
        backgroundColor: 'rgba(23,214,176,0.15)',
        fill: true,
        tension: 0.3,
        pointRadius: 2,
      }]
    },
    options: {
      responsive: true,
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color: '#8B90A8', font: { size: 11 } }, grid: { color: '#2A2F49' } },
        y: { ticks: { color: '#8B90A8', font: { size: 11 } }, grid: { color: '#2A2F49' } },
      }
    }
  });
}

function openItem(name) {
  state.view = 'item';
  state.selected = name;
  state.period = 'today';
  render();
}
function setPeriod(days) {
  state.period = days;
  render();
}
function goBack() {
  state.view = 'dashboard';
  state.selected = null;
  render();
}

function render() {
  if (state.view === 'item' && state.selected) {
    renderItem(state.selected);
  } else {
    renderDashboard();
  }
}

document.getElementById('backBtn').addEventListener('click', goBack);
loadData();
</script>
</body>
</html>
